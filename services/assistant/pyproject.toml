[project]
name = "picpac-assistant"
version = "0.1.0"
description = "picPac Ассистент: агент руководителя (локальная LLM, инструменты-плагины)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "numpy>=1.26",
    "mcp>=2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
