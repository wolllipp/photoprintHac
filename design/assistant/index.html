<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>picPac Ассистент</title>
<!--
  Оболочка ассистента руководителя (трек 3) в стиле приложения picPac: тёплый фон, коралловые действия, Manrope и Unbounded.
  Сервер — services/assistant (Сеня): POST /chat (поток событий), /actions/{id}/confirm|reject, /files, /meta.
  Адрес сервера: ?api=http://host:8001 (по умолчанию http://localhost:8001). Роль — переключатель в шапке (заголовок X-Role).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Pacifico&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --coral: #CC605B; --coral-action: #B84F4B; --coral-link: #A9443F; --coral-tint: #FBEDEC;
  --teal-ink: #1F6F67; --teal-tint: #E3F6F3;
  --bg: #FFFFFF; --card: #F1EAE3; --card2: #E6DCD2; --peach: #FCE9DE; --peach-ink: #A9472B;
  --fg: #1D2120; --mut: #5F6664; --mut2: #A3A8A6; --warn: #A84F00; --warn-tint: #FFF3E3;
  --hair: rgba(35,43,42,0.10);
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 500 16px/1.5 Manrope, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
a { color: var(--coral-link); }

.app { max-width: 820px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding: 0 16px; }

/* шапка */
header { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  display: flex; align-items: center; gap: 12px; padding: 14px 0 12px; }
.logo { font-family: Pacifico, cursive; font-size: 26px; color: var(--coral); line-height: 1; }
.logo-sub { font: 700 15px Unbounded, sans-serif; letter-spacing: -0.3px; }
.status { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--mut); margin-left: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mut2); }
.dot.on { background: #34C38F; box-shadow: 0 0 0 3px rgba(52,195,143,0.18); }
.grow { flex: 1; }
.seg { display: flex; background: var(--card); border-radius: 999px; padding: 3px; }
.seg button { padding: 7px 13px; border-radius: 999px; font-weight: 600; font-size: 13.5px; color: var(--mut); transition: background .2s, color .2s; }
.seg button.on { background: var(--bg); color: var(--fg); box-shadow: 0 1px 4px rgba(60,40,30,0.12); }
.new { width: 38px; height: 38px; border-radius: 50%; background: var(--card); display: grid; place-items: center; transition: transform .15s; }
.new:active { transform: scale(.94); }

/* лента */
main { flex: 1; padding: 8px 0 24px; display: flex; flex-direction: column; gap: 18px; }
.empty { padding: 9vh 0 0; display: flex; flex-direction: column; gap: 14px; animation: rise .5s var(--ease); }
.empty h1 { font: 700 clamp(30px, 6vw, 44px)/1.08 Unbounded, sans-serif; letter-spacing: -1.2px; margin: 0; }
.empty h1 span { color: var(--coral); }
.empty p { margin: 0; color: var(--mut); max-width: 520px; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.preset { background: var(--card); border-radius: 18px; padding: 10px 14px; font-weight: 600; font-size: 14.5px; text-align: left; transition: background .2s, transform .15s; }
.preset:hover { background: var(--card2); }
.preset:active { transform: scale(.97); }
.preset.ai { background: var(--peach); color: var(--peach-ink); }

.msg { animation: rise .35s var(--ease); }
.me { align-self: flex-end; max-width: 82%; background: var(--coral-action); color: #fff; padding: 11px 16px; border-radius: 22px 22px 6px 22px; font-weight: 600; white-space: pre-wrap; }
.bot { display: flex; flex-direction: column; gap: 10px; max-width: 100%; }

.steps { background: var(--card); border-radius: 20px; padding: 6px 14px; }
.steps summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13.5px; font-weight: 600; color: var(--mut); }
.steps summary::-webkit-details-marker { display: none; }
.steps summary .chev { margin-left: auto; transition: transform .25s var(--ease); }
.steps[open] summary .chev { transform: rotate(180deg); }
.step { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-top: 1px solid var(--hair); font-size: 14px; }
.step .ic { width: 20px; height: 20px; flex: none; display: grid; place-items: center; margin-top: 1px; }
.step b { font-weight: 600; }
.step small { display: block; color: var(--mut); font-size: 12.5px; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--card2); border-top-color: var(--coral); animation: spin .8s linear infinite; }

.answer { font-size: 16px; line-height: 1.6; }
.answer p { margin: 0 0 10px; }
.answer p:last-child { margin: 0; }
.answer ul { margin: 0 0 10px; padding-left: 20px; }
.answer li { margin: 3px 0; }
.answer sup { color: var(--coral-link); font-weight: 700; font-size: 11px; margin-left: 1px; }
.answer.typing::after { content: ""; display: inline-block; width: 8px; height: 16px; margin-left: 2px; vertical-align: -2px; background: var(--coral); border-radius: 2px; animation: blink 1s steps(2) infinite; }
.thinking { display: flex; align-items: center; gap: 10px; color: var(--mut); font-size: 14.5px; }
.thinking i { width: 7px; height: 7px; border-radius: 50%; background: var(--coral); animation: pulse 1.2s infinite var(--ease); }
.thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }

.sources { display: flex; flex-wrap: wrap; gap: 6px; }
.src { display: flex; gap: 6px; align-items: baseline; background: var(--teal-tint); color: var(--teal-ink); border-radius: 12px; padding: 6px 10px; font-size: 12.5px; font-weight: 600; max-width: 100%; }
.src em { font-style: normal; font-weight: 500; opacity: .8; }

.arts { display: flex; flex-wrap: wrap; gap: 8px; }
.art-img { display: block; width: 100%; max-width: 560px; border-radius: 18px; border: 1px solid var(--hair); }
.art-file { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 18px; padding: 10px 14px 10px 10px; text-decoration: none; color: var(--fg); font-weight: 600; font-size: 14px; transition: background .2s; }
.art-file:hover { background: var(--card2); }
.ext { width: 40px; height: 40px; border-radius: 12px; background: var(--coral-action); color: #fff; display: grid; place-items: center; font: 700 10.5px Unbounded, sans-serif; letter-spacing: .3px; }

.proposal { border: 2px solid var(--coral-tint); background: #fff; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.proposal .tag { align-self: flex-start; background: var(--coral-tint); color: var(--coral-link); font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; }
.proposal h3 { margin: 0; font: 700 17px/1.3 Unbounded, sans-serif; letter-spacing: -0.3px; }
.proposal pre { margin: 0; white-space: pre-wrap; font: 500 14px/1.5 Manrope, sans-serif; color: var(--mut); }
.row { display: flex; gap: 8px; }
.btn { height: 46px; border-radius: 23px; padding: 0 20px; font-weight: 700; font-size: 15px; transition: transform .15s, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn.main { background: var(--coral-action); color: #fff; }
.btn.ghost { background: var(--card); }
.btn:disabled { opacity: .45; cursor: default; }
.done { font-size: 14px; font-weight: 600; color: var(--teal-ink); background: var(--teal-tint); border-radius: 14px; padding: 9px 12px; }
.done.no { color: var(--mut); background: var(--card); }

.notice { background: var(--warn-tint); color: var(--warn); border-radius: 16px; padding: 10px 14px; font-size: 14px; font-weight: 600; }
.error { background: var(--coral-tint); color: var(--coral-link); border-radius: 16px; padding: 10px 14px; font-size: 14px; font-weight: 600; }

/* поле ввода */
footer { position: sticky; bottom: 0; padding: 10px 0 calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(rgba(255,255,255,0), #fff 30%); }
.composer { display: flex; align-items: flex-end; gap: 8px; background: var(--card); border-radius: 26px; padding: 6px 6px 6px 18px; box-shadow: 0 8px 30px rgba(60,40,30,0.08); transition: box-shadow .25s; }
.composer:focus-within { box-shadow: 0 0 0 2px var(--coral-tint), 0 8px 30px rgba(60,40,30,0.10); }
textarea { flex: 1; resize: none; border: 0; background: none; outline: none; font: 600 16px/1.45 Manrope, sans-serif; color: var(--fg); padding: 9px 0; max-height: 160px; }
textarea::placeholder { color: var(--mut2); }
.send { width: 42px; height: 42px; border-radius: 50%; background: var(--coral-action); display: grid; place-items: center; flex: none; transition: transform .15s, opacity .2s; }
.send:disabled { opacity: .35; cursor: default; }
.send:active { transform: scale(.92); }
.hint { text-align: center; font-size: 12px; color: var(--mut2); margin-top: 8px; }

@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes pulse { 0%, 100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 560px) {
  .logo-sub, .status span { display: none; }
  .seg button { padding: 7px 10px; font-size: 13px; }
  .me { max-width: 90%; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">picPac</div>
    <div class="logo-sub">Ассистент</div>
    <div class="status" title="Модель"><i class="dot" id="dot"></i><span id="statusText">подключаемся…</span></div>
    <div class="grow"></div>
    <div class="seg" role="radiogroup" aria-label="Роль">
      <button data-role="ceo" role="radio">Руководитель</button>
      <button data-role="manager" role="radio">Менеджер</button>
    </div>
    <button class="new" id="newChat" title="Новый разговор" aria-label="Новый разговор">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <main id="feed" aria-live="polite"></main>

  <footer>
    <form class="composer" id="form">
      <textarea id="input" rows="1" placeholder="Спросите ассистента…" aria-label="Вопрос ассистенту" maxlength="1000"></textarea>
      <button class="send" id="send" type="submit" aria-label="Отправить" disabled>
        <svg id="sendIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <div class="hint">Записывает и отправляет только после вашего подтверждения · данные компании не уходят наружу</div>
  </footer>
</div>

<script>
const API = (new URLSearchParams(location.search).get('api') || 'http://localhost:8001').replace(/\/$/, '');
const PRESETS = {
  ceo: ['Что важного сегодня?', 'Почему вырос брак на линии Ricoh?', 'Есть обращения по заказам из приложения?', 'Подготовь встречу по браку на завтра', 'Сделай презентацию итогов квартала'],
  manager: ['Мои задачи на сегодня', 'Есть обращения по заказам из приложения?', 'Почему упала маржа на Premium?', 'Покажи зарплаты операторов ночной смены'],
};
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

let role = store.get('pp.role', 'ceo');
let session = store.get('pp.session', null) || newSession();
let history = [];       // для модели: последние вопросы и ответы
let busy = null;        // AbortController текущего ответа

const $ = (s) => document.querySelector(s);
const feed = $('#feed'), input = $('#input'), send = $('#send');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function newSession() { const id = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); store.set('pp.session', id); return id; }
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const scrollDown = () => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

/* ответ модели: абзацы, списки, **жирный**, ссылки на источники [1] */
function md(text) {
  const blocks = esc(text).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[(\d{1,2})\]/g, '<sup>$1</sup>').split(/\n{2,}/);
  return blocks.map((b) => {
    const lines = b.split('\n');
    if (lines.every((l) => /^\s*([-•*]|\d+[.)])\s+/.test(l))) return '<ul>' + lines.map((l) => '<li>' + l.replace(/^\s*([-•*]|\d+[.)])\s+/, '') + '</li>').join('') + '</ul>';
    return '<p>' + lines.join('<br>') + '</p>';
  }).join('');
}

const ICON = {
  ok: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F6F67" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
  denied: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A84F00" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M7 17L17 7"/></svg>',
  error: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A9443F" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
  chev: '<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>',
  stop: '<svg width="14" height="14" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3" fill="#fff"/></svg>',
  up: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
};

function renderEmpty() {
  feed.innerHTML = '';
  const box = el('section', 'empty');
  box.innerHTML = `<h1>Чем <span>помочь</span>${role === 'ceo' ? '' : ' по работе'}?</h1>
    <p>Отвечаю по данным компании и заказам из приложения со ссылками на источники. Готовлю встречи, протоколы, задачи, презентации. Пишу и отправляю — только после вашего подтверждения.</p>`;
  const row = el('div', 'presets');
  PRESETS[role].forEach((q, i) => {
    const b = el('button', 'preset' + (i === 0 ? ' ai' : ''), esc(q));
    b.onclick = () => ask(q);
    row.append(b);
  });
  box.append(row);
  feed.append(box);
}

function setRole(r) {
  role = r; store.set('pp.role', r);
  document.querySelectorAll('.seg button').forEach((b) => { const on = b.dataset.role === r; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
  if (!history.length) renderEmpty();
}

async function meta() {
  try {
    const m = await fetch(API + '/meta', { headers: { 'X-Role': role } }).then((r) => r.json());
    $('#dot').classList.toggle('on', !!m.online);
    $('#statusText').textContent = m.online ? `${m.model} · ${m.tools.length} инструментов` : 'модель не запущена';
  } catch { $('#dot').classList.remove('on'); $('#statusText').textContent = 'сервис ассистента не отвечает'; }
}

async function ask(q) {
  q = q.trim();
  if (!q || busy) return;
  if (!history.length) feed.innerHTML = '';
  input.value = ''; autosize(); syncSend();
  feed.append(Object.assign(el('div', 'msg me'), { textContent: q }));

  const bot = el('div', 'msg bot');
  const thinking = el('div', 'thinking', '<i></i><i></i><i></i><span>Думаю…</span>');
  bot.append(thinking);
  feed.append(bot); scrollDown();

  let steps = null, list = null, answerText = '';
  const ensureSteps = () => {
    if (steps) return;
    steps = el('details', 'steps'); steps.open = true;
    steps.innerHTML = `<summary><span class="lbl">Работаю…</span>${ICON.chev}</summary>`;
    list = el('div'); steps.append(list);
    bot.insertBefore(steps, thinking);
  };
  const stepEls = {};
  busy = new AbortController(); syncSend();
  try {
    const res = await fetch(API + '/chat', { method: 'POST', signal: busy.signal, headers: { 'Content-Type': 'application/json', 'X-Role': role },
      body: JSON.stringify({ message: q, history, session }) });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.detail || `ошибка ${res.status}`); }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i).replace(/^data: ?/, ''); buf = buf.slice(i + 2);
        if (!line.trim()) continue;
        let ev; try { ev = JSON.parse(line); } catch { continue; }
        handle(ev);
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') bot.append(el('div', 'error', esc(e.message === 'Failed to fetch' ? 'Сервис ассистента не отвечает — запустите services/assistant на порту 8001' : e.message)));
    else bot.append(el('div', 'done no', 'Остановлено'));
  } finally {
    thinking.remove();
    if (steps) { steps.open = false; const n = list.children.length; steps.querySelector('.lbl').textContent = `${n} ${n === 1 ? 'шаг' : n < 5 ? 'шага' : 'шагов'} · как я искал ответ`; }
    busy = null; syncSend();
    if (answerText) { history.push({ role: 'user', content: q }, { role: 'assistant', content: answerText }); history = history.slice(-12); }
  }

  function handle(ev) {
    if (ev.type === 'tool') {
      ensureSteps();
      thinking.querySelector('span').textContent = ev.label + '…';
      const s = el('div', 'step', `<span class="ic"><span class="spin"></span></span><div><b>${esc(ev.label)}</b><small></small></div>`);
      stepEls[ev.id] = s; list.append(s); scrollDown();
    } else if (ev.type === 'tool_result') {
      const s = stepEls[ev.id]; if (!s) return;
      s.querySelector('.ic').innerHTML = ICON[ev.status] || ICON.ok;
      s.querySelector('small').textContent = ev.status === 'denied' ? 'нет доступа по роли' : (ev.summary || '');
    } else if (ev.type === 'notice') {
      bot.insertBefore(el('div', 'notice', esc(ev.text)), thinking);
    } else if (ev.type === 'error') {
      bot.insertBefore(el('div', 'error', esc(ev.text)), thinking);
    } else if (ev.type === 'artifact') {
      let arts = bot.querySelector('.arts');
      if (!arts) { arts = el('div', 'arts'); bot.insertBefore(arts, thinking); }
      const url = /^https?:/.test(ev.url) ? ev.url : API + ev.url;
      if (ev.kind === 'image') {
        const a = el('a', '', `<img class="art-img" src="${esc(url)}" alt="${esc(ev.title)}">`);
        a.href = url; a.target = '_blank'; a.rel = 'noopener'; arts.append(a);
      } else {
        const a = el('a', 'art-file', `<span class="ext">${esc((ev.name.split('.').pop() || 'файл').toUpperCase())}</span>${esc(ev.title || ev.name)}`);
        a.href = url; a.download = ev.name; arts.append(a);
      }
    } else if (ev.type === 'proposal') {
      bot.insertBefore(proposalCard(ev), thinking);
    } else if (ev.type === 'answer') {
      answerText = ev.text || '';
      const box = el('div', 'answer typing'); bot.insertBefore(box, thinking);
      typeOut(box, answerText).then(() => {
        box.classList.remove('typing');
        if (ev.sources?.length) {
          const src = el('div', 'sources');
          ev.sources.forEach((s) => src.append(el('div', 'src', `${s.n}. ${esc(s.name)}${s.detail ? ` <em>· ${esc(s.detail)}</em>` : ''}`)));
          box.after(src);
        }
        scrollDown();
      });
    }
  }
}

/* ответ появляется плавно, по словам — как печатает человек, но быстро */
function typeOut(box, text) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { box.innerHTML = md(text); return Promise.resolve(); }
  const words = text.split(/(\s+)/);
  let i = 0;
  return new Promise((done) => {
    const step = () => {
      i = Math.min(words.length, i + 4);
      box.innerHTML = md(words.slice(0, i).join(''));
      if (i % 24 === 0) scrollDown();
      if (i < words.length) requestAnimationFrame(step); else done();
    };
    step();
  });
}

/* действие, которое пишет или отправляет: карточка с «Подтвердить» и «Отклонить» */
function proposalCard(ev) {
  const card = el('div', 'proposal');
  card.innerHTML = `<span class="tag">${ev.risk === 'external' ? 'Отправит сообщение' : 'Запишет в систему'} · ждёт вашего решения</span>
    <h3>${esc(ev.title)}</h3>${ev.details ? `<pre>${esc(typeof ev.details === 'string' ? ev.details : JSON.stringify(ev.details, null, 2))}</pre>` : ''}`;
  const row = el('div', 'row');
  const yes = el('button', 'btn main', 'Подтвердить');
  const no = el('button', 'btn ghost', 'Отклонить');
  const act = async (verb) => {
    yes.disabled = no.disabled = true;
    const r = await fetch(`${API}/actions/${ev.id}/${verb}`, { method: 'POST', headers: { 'X-Role': role } }).then((x) => x.json()).catch(() => ({ ok: false, error: 'нет связи' }));
    row.replaceWith(el('div', 'done' + (verb === 'reject' || !r.ok ? ' no' : ''), esc(r.ok ? r.message : r.error)));
  };
  yes.onclick = () => act('confirm'); no.onclick = () => act('reject');
  row.append(yes, no); card.append(row);
  return card;
}

function autosize() { input.style.height = 'auto'; input.style.height = Math.min(160, input.scrollHeight) + 'px'; }
function syncSend() {
  send.disabled = !busy && !input.value.trim();
  send.innerHTML = busy ? ICON.stop : ICON.up;
  send.setAttribute('aria-label', busy ? 'Остановить' : 'Отправить');
}
input.addEventListener('input', () => { autosize(); syncSend(); });
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(input.value); } });
$('#form').addEventListener('submit', (e) => { e.preventDefault(); if (busy) busy.abort(); else ask(input.value); });
$('#newChat').onclick = () => { if (busy) busy.abort(); history = []; session = newSession(); renderEmpty(); input.focus(); };
document.querySelectorAll('.seg button').forEach((b) => (b.onclick = () => { setRole(b.dataset.role); meta(); }));

setRole(role);
meta();
setInterval(meta, 30000);
</script>
</body>
</html>
