<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>picPac для руководителя</title>
<!--
  Рабочее место руководителя (трек 3) — теми же приёмами, что приложение picPac (apps/mobile):
  кружки-истории сверху (отклонения дня, просмотр во весь экран как у подборок), «Сейчас» с главным делом,
  ближайшие задачи датами (как «Скоро»), «Решения» с кольцом этапа, сегментами и плавным раскрытием (как «Заказы»),
  плавающее стеклянное меню из трёх кнопок, ассистент — лист снизу с голосовым полем со свечением, светлые уведомления.
  Данные дня — GET /insight/data сервера приложения (?data=…); ассистент — services/assistant (?api=…, по умолчанию :8001).
  Роль одна — руководитель (X-Role: ceo).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Pacifico&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --coral: #CC605B; --coral-action: #B84F4B; --coral-link: #A9443F; --coral-tint: #FBEDEC;
  --teal-ink: #1F6F67; --teal-tint: #E3F6F3;
  --bg: #FFFFFF; --card: #F1EAE3; --card2: #E6DCD2; --peach: #FCE9DE; --peach-ink: #A9472B;
  --fg: #1D2120; --ink2: #3B4B4A; --mut: #5F6664; --mut2: #A3A8A6; --warn: #A84F00; --warn-tint: #FFF3E3;
  --hair: rgba(35,43,42,0.10);
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-out: cubic-bezier(0.33, 0, 0.2, 1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 500 16px/1.5 Manrope, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
.tap { transition: transform .12s var(--ease-out), opacity .12s; }
.tap:active { transform: scale(.965); opacity: .9; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 140px; }
.view { display: flex; flex-direction: column; gap: 24px; }
.view[hidden] { display: none; }
.enter > * { animation: down .42s var(--ease-out) both; }
.enter > *:nth-child(2) { animation-delay: .05s; } .enter > *:nth-child(3) { animation-delay: .1s; } .enter > *:nth-child(4) { animation-delay: .15s; } .enter > *:nth-child(5) { animation-delay: .2s; }

.top { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 0; }
.logo { display: flex; align-items: center; gap: 8px; }
.logo-svg { width: 92px; height: auto; fill: var(--coral); display: block; }  /* оригинальный вектор picpac.by — как components/logo.tsx */
.logo small { font: 700 13px Unbounded, sans-serif; color: var(--fg); letter-spacing: -.2px; margin-top: 10px; }
.me { display: flex; align-items: center; gap: 10px; }
.me .who { text-align: right; line-height: 1.2; }
.me .who b { display: block; font-size: 14px; }
.me .who span { font-size: 12px; color: var(--mut); }
.avatar { width: 44px; height: 44px; border-radius: 15px; background: var(--peach); color: var(--peach-ink); display: grid; place-items: center; font: 700 16px Unbounded, sans-serif; }
.h1 { font: 700 26px/1.15 Unbounded, sans-serif; letter-spacing: -.6px; margin: 0; }
.cap { font-size: 15px; font-weight: 600; color: var(--mut); padding: 0 4px; margin: 0 0 8px; }

.rings { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0 2px; }
.rings::-webkit-scrollbar { display: none; }
.ring-item { flex: 1; min-width: 0; max-width: 96px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.ring { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; }
.ring.new { background: var(--coral-action); }
.ring.story { border: 2.5px dashed var(--coral); }
.ring.story.seen { border-color: var(--card2); }
.ring .face { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; font: 700 14px/1 Unbounded, sans-serif; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.ring-label { font-size: 12px; line-height: 15px; text-align: center; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ring.seen + .ring-label { color: var(--mut); }

.hero { position: relative; border-radius: 24px; overflow: hidden; padding: 16px; min-height: 170px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; width: 100%;
  background: radial-gradient(120% 90% at 100% 0%, #F7D5C2 0%, rgba(247,213,194,0) 60%), linear-gradient(160deg, #CC605B 0%, #A9443F 100%); color: #fff; }
.hero .tag { align-self: flex-start; height: 28px; padding: 0 11px; border-radius: 14px; background: rgba(255,255,255,0.2); display: flex; align-items: center; font-size: 12.5px; font-weight: 600; }
.hero .big { font: 800 64px/0.95 Unbounded, sans-serif; letter-spacing: -3px; font-variant-numeric: tabular-nums; margin: 8px 0 4px; }
.hero .big small { font-size: 26px; letter-spacing: -1px; opacity: .85; margin-left: 2px; }
.hero .title { font: 700 19px/1.25 Unbounded, sans-serif; letter-spacing: -.3px; }
.hero .sub { font-size: 13.5px; opacity: .88; margin-top: 2px; }
.row { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 22px; padding: 11px 12px; width: 100%; text-align: left; }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-size: 15.5px; line-height: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t span { display: block; font-size: 13px; line-height: 17px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { color: var(--mut2); flex: none; }
.stack { display: flex; flex-direction: column; gap: 8px; }

.stage { width: 46px; height: 46px; flex: none; position: relative; display: grid; place-items: center; font: 700 15px Manrope, sans-serif; font-variant-numeric: tabular-nums; }
.stage svg:first-child { position: absolute; inset: 0; }

.date { width: 46px; height: 50px; flex: none; border-radius: 14px; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.date b { font: 700 18px Unbounded, sans-serif; letter-spacing: -.5px; }
.date span { font-size: 10.5px; font-weight: 700; color: var(--mut); text-transform: uppercase; margin-top: 3px; }
.date.late { background: var(--coral-tint); } .date.late b, .date.late span { color: var(--coral-link); }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--card); border-radius: 20px; padding: 13px 12px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.tile b { font: 700 26px/1.1 Unbounded, sans-serif; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12.5px; color: var(--mut); font-weight: 600; line-height: 1.3; }
.tile.alert b { color: var(--coral-link); }

.seg { display: flex; background: var(--card); border-radius: 999px; padding: 3px; align-self: flex-start; }
.seg button { padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--mut); transition: background .25s var(--ease-out), color .25s; }
.seg button.on { background: var(--bg); color: var(--fg); box-shadow: 0 1px 4px rgba(60,40,30,0.12); }
.case { background: var(--card); border-radius: 22px; }
.case > .row { background: none; }
.case .more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .38s var(--ease); }
.case.open .more { grid-template-rows: 1fr; }
.case .more > div { overflow: hidden; }
.case .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.case .row .chev { transition: transform .38s var(--ease); }
.case.open .row .chev { transform: rotate(90deg); }
.steps5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.steps5 i { height: 5px; border-radius: 3px; background: var(--card2); }
.steps5 i.on { background: var(--coral-action); }
.steps5.done i.on { background: var(--teal-ink); }
.steps5-l { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; font-size: 11px; color: var(--mut); font-weight: 600; margin-top: -6px; }
.cause { background: var(--bg); border-radius: 16px; padding: 12px 14px; font-size: 14.5px; line-height: 1.5; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { height: 46px; border-radius: 23px; padding: 0 18px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.main { background: var(--coral-action); color: #fff; }
.btn.ghost { background: var(--bg); }
.btn:disabled { opacity: .45; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 12px; padding: 30px 0 calc(16px + env(safe-area-inset-bottom));
  background: linear-gradient(rgba(255,255,255,0), rgba(255,255,255,0.92) 55%); pointer-events: none; }
.dock button { pointer-events: auto; height: 58px; min-width: 58px; border-radius: 29px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 18px; font-weight: 700; font-size: 14.5px;
  background: rgba(255,255,255,0.72); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
  box-shadow: 0 8px 24px rgba(60,40,30,0.14), inset 0 0 0 1px rgba(255,255,255,0.8); transition: background .25s var(--ease-out), color .25s, transform .12s; }
.dock button.on { background: var(--coral-action); color: #fff; box-shadow: 0 10px 26px rgba(184,79,75,0.35); }
.dock button:active { transform: scale(.95); }
.dock .ask { width: 58px; padding: 0; background: var(--coral-action); box-shadow: 0 10px 26px rgba(184,79,75,0.35); }
.dock .badge { min-width: 20px; height: 20px; border-radius: 10px; background: var(--coral-action); color: #fff; font-size: 11.5px; display: inline-grid; place-items: center; padding: 0 6px; }
.dock .badge[hidden] { display: none; }
.dock button.on .badge { background: #fff; color: var(--coral-action); }

.viewer { position: fixed; inset: 0; z-index: 50; background: #000; display: none; touch-action: none; user-select: none; }
.viewer.open { display: block; animation: fade .3s var(--ease-out); }
.vsheet { position: absolute; inset: 0; overflow: hidden; }
.frame { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 22px calc(120px + env(safe-area-inset-bottom)); color: #fff; animation: fade .25s var(--ease-out); }
.frame > * { max-width: 620px; }
.frame.cover { background: radial-gradient(110% 70% at 100% 0%, #F7D5C2 0%, rgba(247,213,194,0) 55%), linear-gradient(165deg, #CC605B 0%, #8E3A36 100%); }
.frame.calm { background: linear-gradient(165deg, #3B4B4A 0%, #1D2120 100%); }
.frame.teal { background: linear-gradient(165deg, #2B8A80 0%, #1F6F67 100%); }
.frame .k { font-size: 14px; font-weight: 700; opacity: .85; margin-bottom: 6px; }
.frame .huge { font: 800 clamp(84px, 26vw, 150px)/0.9 Unbounded, sans-serif; letter-spacing: -6px; font-variant-numeric: tabular-nums; }
.frame .huge small { font-size: .38em; letter-spacing: -1px; opacity: .85; }
.frame h2 { font: 800 clamp(28px, 7.5vw, 44px)/1.05 Unbounded, sans-serif; letter-spacing: -1.2px; margin: 10px 0 6px; }
.frame p { font-size: 17px; line-height: 1.45; opacity: .92; margin: 0; }
.bars { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
.bar { display: grid; grid-template-columns: 120px 1fr 54px; gap: 10px; align-items: center; font-size: 14px; font-weight: 600; }
.bar i { height: 12px; border-radius: 6px; background: rgba(255,255,255,0.18); position: relative; overflow: hidden; }
.bar i::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: var(--w); border-radius: 6px; background: #fff; transform-origin: left; animation: grow .7s var(--ease) both; }
.bar.hot i::after { background: #F7D5C2; }
.bar b { text-align: right; font-variant-numeric: tabular-nums; }
.vtop { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top)) 12px 0; z-index: 3; transition: opacity .35s var(--ease-out); }
.progress { display: flex; gap: 4px; }
.progress i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.35); overflow: hidden; }
.progress i b { display: block; height: 100%; width: 0; background: #fff; }
.vhead { display: flex; align-items: center; gap: 10px; margin-top: 12px; color: #fff; }
.vhead .t { font-weight: 700; font-size: 14.5px; flex: 1; }
.vclose { width: 36px; height: 36px; border-radius: 18px; background: rgba(255,255,255,0.18); display: grid; place-items: center; }
.vfoot { position: absolute; left: 16px; right: 16px; bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 3; display: flex; gap: 8px; max-width: 620px; transition: opacity .35s var(--ease-out); }
.vfoot .btn { flex: 1; height: 54px; border-radius: 27px; font-size: 16px; }
.vfoot .btn.main { background: #fff; color: var(--coral-action); }
.vfoot .btn.ghost { background: rgba(255,255,255,0.18); color: #fff; flex: 0 0 auto; padding: 0 20px; }
.viewer.paused .vtop, .viewer.paused .vfoot { opacity: 0; }

/* графики в историях: белые линии и столбики на цветном фоне, рисуются при открытии кадра */
.chart { width: 100%; margin-top: 16px; overflow: visible; }
.chart .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s var(--ease) .1s forwards; }
.chart .area { opacity: 0; animation: fade .6s var(--ease-out) .7s forwards; }
.chart .pop { opacity: 0; animation: fade .3s var(--ease-out) 1.05s forwards; }
.chart .col { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: rise .8s var(--ease) forwards; }
.chart text { font-family: Manrope, sans-serif; fill: #fff; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12.5px; font-weight: 600; opacity: .9; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px dashed #fff; vertical-align: middle; margin-right: 6px; }
.legend i.solid { border-top-style: solid; border-top-width: 3px; }
.legend i.hot { border-color: #F7D5C2; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes rise { to { transform: scaleY(1); } }
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(20,16,14,0.35); opacity: 0; pointer-events: none; transition: opacity .3s var(--ease-out); }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; height: 92vh; height: 92dvh; background: var(--bg); border-radius: 30px 30px 0 0; display: flex; flex-direction: column;
  transform: translateY(105%); transition: transform .42s var(--ease); box-shadow: 0 -10px 40px rgba(60,40,30,0.12); }
.sheet.open { transform: none; }
.sheet .in { max-width: 720px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; flex: 1; min-height: 0; }
.grab { align-self: center; width: 38px; height: 5px; border-radius: 3px; background: var(--card2); margin-top: 8px; flex: none; }
.shead { display: flex; align-items: center; gap: 10px; padding: 10px 16px 4px; }
.shead .h1 { font-size: 22px; flex: 1; }
.round { width: 38px; height: 38px; border-radius: 19px; background: var(--card); display: grid; place-items: center; flex: none; }
.status { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--mut); padding: 0 16px 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mut2); flex: none; }
.dot.on { background: #34C38F; box-shadow: 0 0 0 3px rgba(52,195,143,0.18); }
.feed { flex: 1; overflow-y: auto; padding: 6px 16px 16px; display: flex; flex-direction: column; gap: 16px; overscroll-behavior: contain; }
.hello { color: var(--mut); font-size: 15px; display: flex; flex-direction: column; gap: 12px; padding-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--card); border-radius: 18px; padding: 9px 14px; font-weight: 600; font-size: 14.5px; color: var(--fg); text-align: left; }
.chip.ai { background: var(--peach); color: var(--peach-ink); }
.msg { animation: down .35s var(--ease-out) both; }
.mine { align-self: flex-end; max-width: 84%; background: var(--coral-action); color: #fff; padding: 10px 15px; border-radius: 22px 22px 6px 22px; font-weight: 600; white-space: pre-wrap; }
.bot { display: flex; flex-direction: column; gap: 10px; }
.thinking { font-size: 14.5px; font-weight: 600; background: linear-gradient(90deg, var(--mut) 0%, var(--mut) 40%, var(--mut2) 50%, var(--mut) 60%, var(--mut) 100%); background-size: 250% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.6s linear infinite; }
.steps { background: var(--card); border-radius: 18px; padding: 4px 14px; }
.steps summary { list-style: none; cursor: pointer; padding: 7px 0; font-size: 13.5px; font-weight: 600; color: var(--mut); }
.steps summary::-webkit-details-marker { display: none; }
.step { display: flex; gap: 10px; padding: 6px 0; border-top: 1px solid var(--hair); font-size: 13.5px; }
.step .ic { width: 18px; height: 18px; flex: none; display: grid; place-items: center; margin-top: 2px; }
.step small { display: block; color: var(--mut); font-size: 12.5px; }
.spin { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--card2); border-top-color: var(--coral); animation: spin .8s linear infinite; }
.answer { font-size: 16px; line-height: 1.6; }
.answer p { margin: 0 0 10px; } .answer p:last-child { margin: 0; }
.answer ul { margin: 0 0 10px; padding-left: 20px; }
.answer sup { color: var(--coral-link); font-weight: 700; font-size: 11px; }
.sources { display: flex; flex-wrap: wrap; gap: 6px; }
.src { background: var(--teal-tint); color: var(--teal-ink); border-radius: 12px; padding: 5px 10px; font-size: 12.5px; font-weight: 600; }
.arts { display: flex; flex-wrap: wrap; gap: 8px; }
.art-img { display: block; max-width: 100%; border-radius: 18px; border: 1px solid var(--hair); }
.art-file { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 18px; padding: 8px 14px 8px 8px; text-decoration: none; color: var(--fg); font-weight: 600; font-size: 14px; }
.ext { width: 38px; height: 38px; border-radius: 12px; background: var(--coral-action); color: #fff; display: grid; place-items: center; font: 700 10px Unbounded, sans-serif; }
.proposal { border: 2px solid var(--coral-tint); border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.proposal .tag { align-self: flex-start; background: var(--coral-tint); color: var(--coral-link); font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; }
.proposal h3 { margin: 0; font: 700 16.5px/1.3 Unbounded, sans-serif; letter-spacing: -.3px; }
.proposal pre { margin: 0; white-space: pre-wrap; font: 500 14px/1.5 Manrope, sans-serif; color: var(--mut); }
.next { display: flex; flex-wrap: wrap; gap: 8px; }
.next button { border: 1.5px solid var(--card2); border-radius: 999px; padding: 7px 13px; font-weight: 700; font-size: 13.5px; }
.note { border-radius: 16px; padding: 10px 14px; font-size: 14px; font-weight: 600; }
.note.warn { background: var(--warn-tint); color: var(--warn); } .note.err { background: var(--coral-tint); color: var(--coral-link); } .note.ok { background: var(--teal-tint); color: var(--teal-ink); }

.composer { padding: 8px 16px calc(14px + env(safe-area-inset-bottom)); }
.vf { position: relative; }
.vf .halo, .vf .ringc { position: absolute; inset: -3px; border-radius: 29px; opacity: 0; transition: opacity .3s var(--ease-out); pointer-events: none; }
.vf .ringc { background: conic-gradient(from 0deg, #34D399, #60A5FA, #A78BFA, #F472B6, #FB923C, #34D399); }
.vf .halo { inset: -10px; border-radius: 36px; background: conic-gradient(from 90deg, #34D399, #60A5FA, #A78BFA, #F472B6, #FB923C, #34D399); filter: blur(18px); }
.vf.listening .ringc { opacity: .75; }
.vf.listening .halo { opacity: .55; animation: breathe 1.6s ease-in-out infinite; }
.field { position: relative; display: flex; align-items: flex-end; gap: 6px; background: var(--card); border-radius: 26px; padding: 6px 6px 6px 18px; transition: background .3s; }
.vf.listening .field { background: #fff; }
textarea { flex: 1; resize: none; border: 0; background: none; outline: none; font: 600 16px/1.45 Manrope, sans-serif; color: var(--fg); padding: 9px 0; max-height: 140px; }
textarea::placeholder { color: var(--mut2); }
.fbtn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.fbtn.mic { background: var(--bg); }
.fbtn.send { background: var(--coral-action); }
.fbtn:disabled { opacity: .35; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 60; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: #fff; border-radius: 18px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14.5px; box-shadow: 0 10px 30px rgba(60,40,30,0.18); transition: transform .35s var(--ease), opacity .25s; max-width: calc(100% - 32px); }
.toast.show { transform: translate(-50%, 0); opacity: 1; }

@keyframes down { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { 0%, 100% { transform: scale(.98); } 50% { transform: scale(1.03); } }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -150% 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
@media (max-width: 480px) {
  .me .who { display: none; }
  .dock button { padding: 0 14px; font-size: 13.5px; }
  .tile { padding: 12px 10px; } .tile b { font-size: 22px; }
  .bar { grid-template-columns: 96px 1fr 48px; font-size: 13px; }
}

<script>
const Q = new URLSearchParams(location.search);
const API = (Q.get('api') || 'http://localhost:8001').replace(/\/$/, '');
const DATA = Q.get('data') || API.replace(/:\d+$/, ':8000') + '/insight/data';
const ROLE = 'ceo';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const num = (x, k = 1) => Number(x).toLocaleString('ru-RU', { minimumFractionDigits: k, maximumFractionDigits: k });
const pl = (n, a, b, c) => (n % 10 === 1 && n % 100 !== 11 ? a : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? b : c);
const MONTH = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const CHEV = '<svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';
const STAGES = ['Сигнал', 'Причина', 'Решение', 'Проверка', 'Закрыто'];

function toast(text) {
  const t = $('#toast');
  t.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F6F67" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>${esc(text)}`;
  t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3200);
}

/* кольцо этапа (StageRing): доля круга по этапу; закрыто — бирюзовое с галочкой */
function stageRing(stage, size = 46) {
  const w = size / 10, r = (size - w) / 2, c = 2 * Math.PI * r, done = stage >= 4, part = Math.max(0.08, (stage + 1) / 5), tint = done ? '#1F6F67' : '#B84F4B';
  return `<div class="stage"><svg width="${size}" height="${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="#E6DCD2" stroke-width="${w}" fill="none"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="${tint}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-dasharray="${c * part} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg>
    ${done ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F6F67" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>' : `<span>${stage + 1}</span>`}</div>`;
}

/* ---------- данные: /insight/data — демо-история компании + живые заказы и обращения приложения ---------- */
let D = null, CASES = [];
async function loadData() {
  try { D = await fetch(DATA).then((r) => r.json()); } catch { D = null; }
  build(); renderToday(); renderCases();
}
function build() {
  CASES = [];
  if (!D) return;
  const C = D.columns, rows = D.production.map((r) => Object.fromEntries(C.map((c, i) => [c, r[i]])));
  const R = D.rules, inw = (xs, [a, b]) => xs.filter((r) => r.w >= a && r.w <= b);
  const rate = (xs) => xs.reduce((a, r) => a + r.defects, 0) / Math.max(1, xs.reduce((a, r) => a + r.sheets, 0));
  const ricoh = rows.filter((r) => r.line === R.ricoh), now = inw(ricoh, R.current);
  const cur = rate(now), base = rate(inw(ricoh, R.baseline));
  const byShift = ['День', 'Ночь'].map((s) => [s, rate(now.filter((r) => r.shift === s)) * 100]);
  const last = D.meta.lastWeek, weeks = Array.from({ length: 12 }, (_, k) => last - 11 + k);
  const weekly = (xs, f) => weeks.map((w) => ({ w, v: f(xs.filter((r) => r.w === w)) }));
  const ev = (D.chartEvents || [])[0];
  const byProduct = [...new Set(ricoh.map((r) => r.product))].map((p) => [p.replace('Фотокнига ', '').replace('Фотопечать, ', 'печать, '), rate(now.filter((r) => r.product === p)) * 100]);
  const oc = D.otherCases || {};
  CASES.push({ id: D.deviationsMeta.main, short: 'Брак Ricoh', title: 'Брак на линии Ricoh выше нормы', value: num(cur * 100), unit: '%', stage: 1,
    sub: `норма ${num(base * 100)}% · выше в ${num(cur / base)} раза`, cause: D.assistant?.causeSummary,
    extra: D.batchChange ? `Смена партии: ${D.batchChange.from} → ${D.batchChange.to}` : '', where: [['По сменам', byShift], ['По продуктам', byProduct]],
    trend: { title: 'Брак по неделям', pts: weekly(ricoh, (xs) => rate(xs) * 100), norm: base * 100, limit: base * 100 * R.detectFactor, unit: '%', mark: ev, hotFrom: R.current[0] }, normV: base * 100,
    ask: 'Почему вырос брак на линии Ricoh?', tone: 'cover' });
  const prem = rows.filter((r) => r.product === R.premium);
  const disc = (xs) => xs.reduce((a, r) => a + r.discount, 0) / Math.max(1, xs.reduce((a, r) => a + r.revenue + r.discount, 0));
  const dc = disc(inw(prem, R.current)), db = disc(inw(prem, R.baseline));
  CASES.push({ id: D.deviationsMeta.discount, short: 'Скидка', title: oc['D-117']?.title || 'Скидка на Premium выше нормы', value: num(dc * 100), unit: '%', stage: 0,
    sub: `норма ${num(db * 100)}% · выше в ${num(dc / db)} раза`, cause: oc['D-117']?.cause,
    trend: { title: 'Средняя скидка по неделям', pts: weekly(prem, (xs) => disc(xs) * 100), norm: db * 100, limit: db * 100 * 1.2, unit: '%', hotFrom: R.current[0] }, ask: 'Почему упала маржа на Premium?', tone: 'cover' });
  const hr = inw(D.hr, R.current), staffed = hr.reduce((a, r) => a + r.staffed, 0) / Math.max(1, hr.reduce((a, r) => a + r.planned, 0));
  CASES.push({ id: D.deviationsMeta.staffing, short: 'Смены', title: oc['D-119']?.title || 'Укомплектованность смен ниже порога', value: num(staffed * 100, 0), unit: '%', stage: 0,
    sub: `порог ${num(R.staffingMin * 100, 0)}% · в сменах меньше людей, чем по плану`, cause: oc['D-119']?.cause,
    trend: { title: 'Люди в сменах по неделям', pts: weeks.map((w) => { const h = D.hr.filter((r) => r.w === w); return { w, v: (h.reduce((a, r) => a + r.staffed, 0) / Math.max(1, h.reduce((a, r) => a + r.planned, 0))) * 100 }; }), limit: R.staffingMin * 100, low: true, unit: '%', hotFrom: R.current[0] }, ask: 'Почему не хватает людей в сменах?', tone: 'calm' });
  const lv = D.live || {}, open = lv.support_open ?? 0;
  const at = lv.updated_at ? new Date(lv.updated_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '—';
  CASES.push({ id: 'APP', short: 'Приложение', title: 'Заказы и обращения из приложения', value: String(lv.orders_total ?? 0), unit: '', stage: open ? 0 : 4, live: true,
    sub: `${pl(lv.orders_total ?? 0, 'заказ', 'заказа', 'заказов')} · ${open} ${pl(open, 'открытое обращение', 'открытых обращения', 'открытых обращений')} · на ${at}`,
    cause: open ? 'Клиенты пишут по конкретным заказам — номера и темы у ассистента.' : 'Открытых обращений нет, заказы идут по этапам.',
    ask: 'Есть обращения по заказам из приложения?', tone: 'teal',
    stages: [['Принят', 'accepted'], ['Проверен', 'layout_checked'], ['Печать', 'printing'], ['В пути', 'handed_to_delivery'], ['Готов', 'delivered']].map(([n, k]) => [n, (lv.orders_by_stage || {})[k] || 0]) });
}

/* ---------- «Сегодня» ---------- */
let seen = store.get('pulse.seen', []);
function renderToday() {
  const today = D?.meta?.today ? new Date(D.meta.today) : new Date();
  $('#dateLine').textContent = today.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  // кружки — сводка за вчера: что изменилось к концу прошлого дня
  const yesterday = new Date(today.getTime() - 864e5);
  $('#ringsCap').textContent = `Сводка за вчера · ${yesterday.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })}`;
  const rings = $('#rings'); rings.innerHTML = '';
  CASES.forEach((c, i) => {
    const old = seen.includes(c.id);
    const face = c.tone === 'teal' ? 'background:#E3F6F3;color:#1F6F67' : c.tone === 'calm' ? 'background:#F1EAE3;color:#3B4B4A' : 'background:#FCE9DE;color:#A9472B';
    const b = el('button', 'ring-item tap', `<div class="ring story${old ? ' seen' : ''}"><div class="face" style="${face}"><span>${esc(c.value)}${c.unit ? `<small style="font-size:10px">${c.unit}</small>` : ''}</span></div></div><div class="ring-label">${esc(c.short)}</div>`);
    b.onclick = () => openStory(i); rings.append(b);
  });
  if (!D) { $('#now').innerHTML = `<div class="note warn">Данные дня не загрузились — запустите сервер приложения на :8000. Ассистент работает и так.</div>`; $('#tiles').innerHTML = ''; $('#soon').innerHTML = ''; return; }
  const main = CASES[0];
  $('#now').innerHTML = `<p class="cap">Сейчас</p>`;
  const hero = el('button', 'hero tap', `<span class="tag">Требует решения · ${esc(main.id)}</span>
    <div><div class="big">${esc(main.value)}<small>${main.unit}</small></div><div class="title">${esc(main.title)}</div><div class="sub">${esc(main.sub)}</div></div>`);
  hero.onclick = () => openStory(0);
  $('#now').append(hero);
  const lv = D.live || {}, late = (D.tasks || []).filter((t) => t.status === 'просрочена').length;
  const tiles = $('#tiles'); tiles.innerHTML = '';
  [[lv.orders_total ?? 0, pl(lv.orders_total ?? 0, 'заказ из приложения', 'заказа из приложения', 'заказов из приложения'), 'Что с заказами из приложения?', false],
   [lv.support_open ?? 0, pl(lv.support_open ?? 0, 'открытое обращение', 'открытых обращения', 'открытых обращений'), 'Есть обращения по заказам из приложения?', (lv.support_open ?? 0) > 0],
   [late, pl(late, 'задача просрочена', 'задачи просрочены', 'задач просрочено'), 'Какие задачи просрочены?', late > 0]].forEach(([n, label, q, alert]) => {
    const t = el('button', 'tile tap' + (alert ? ' alert' : ''), `<b>${n}</b><span>${label}</span>`); t.onclick = () => openAsk(q); tiles.append(t);
  });
  const soon = $('#soon'); soon.innerHTML = `<p class="cap">Скоро</p>`;
  const list = el('div', 'stack');
  (D.tasks || []).slice().sort((a, b) => a.due.localeCompare(b.due)).forEach((t) => {
    const d = new Date(t.due), isLate = t.status === 'просрочена';
    const r = el('button', 'row tap', `<div class="date${isLate ? ' late' : ''}"><b>${d.getDate()}</b><span>${MONTH[d.getMonth()]}</span></div>
      <div class="t"><b>${esc(t.title)}</b><span>${esc(t.owner)} · ${isLate ? 'просрочена' : esc(t.status)}</span></div>${CHEV}`);
    r.onclick = () => openAsk(`Что с задачей «${t.title}»?`); list.append(r);
  });

/* линия по неделям: норма (пунктир), порог (пунктир персиковым), текущие недели — жирнее, отметка события */

/* столбики: значения сверху, самый высокий — персиковый, линия нормы */
function colChart(rows, norm, unit = '%') {

      typeOut(box, answer).then(() => {
        if (ev.sources?.length) { const s = el('div', 'sources'); ev.sources.forEach((x) => s.append(el('div', 'src', `${x.n}. ${esc(x.name)}`))); box.after(s); }
        const nx = el('div', 'next');
        [['Назначить встречу', `Назначь встречу по этому вопросу: ${q}`], ['Создать задачу', `Создай задачу по итогам: ${q}`], ['Сделать презентацию', `Сделай короткую презентацию по ответу: ${q}`]]
          .forEach(([l, p]) => { const b = el('button', 'tap', esc(l)); b.onclick = () => ask(p); nx.append(b); });
        bot.append(nx); toBottom();
      });
    }
  }
}
function typeOut(box, text) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { box.innerHTML = md(text); return Promise.resolve(); }
  const w = text.split(/(\s+)/); let i = 0;
  return new Promise((done) => { const step = () => { i = Math.min(w.length, i + 4); box.innerHTML = md(w.slice(0, i).join('')); if (i % 24 === 0) toBottom(); i < w.length ? requestAnimationFrame(step) : done(); }; step(); });
}
function proposal(ev) {
  const card = el('div', 'proposal', `<span class="tag">${ev.risk === 'external' ? 'Отправит сообщение' : 'Запишет в систему'} · ждёт вашего решения</span><h3>${esc(ev.title)}</h3>${ev.details ? `<pre>${esc(typeof ev.details === 'string' ? ev.details : JSON.stringify(ev.details, null, 2))}</pre>` : ''}`);
  const row = el('div', 'btns'), yes = el('button', 'btn main tap', 'Подтвердить'), no = el('button', 'btn ghost tap', 'Отклонить');
  no.style.background = 'var(--card)';
  const act = async (verb) => {
    yes.disabled = no.disabled = true;
    const r = await fetch(`${API}/actions/${ev.id}/${verb}`, { method: 'POST', headers: { 'X-Role': ROLE } }).then((x) => x.json()).catch(() => ({ ok: false, error: 'нет связи' }));
    row.replaceWith(el('div', 'note ' + (r.ok && verb === 'confirm' ? 'ok' : 'warn'), esc(r.ok ? r.message : r.error)));
    if (r.ok && verb === 'confirm') toast('Сделано: ' + ev.title);
  };
  yes.onclick = () => act('confirm'); no.onclick = () => act('reject'); row.append(yes, no); card.append(row);
  return card;
}

function autosize() { input.style.height = 'auto'; input.style.height = Math.min(140, input.scrollHeight) + 'px'; }
function sync() { send.disabled = !busy && !input.value.trim(); send.innerHTML = busy ? ICON.stop : ICON.up; send.setAttribute('aria-label', busy ? 'Остановить' : 'Отправить'); }
input.addEventListener('input', () => { autosize(); sync(); });
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(input.value); } });
$('#form').addEventListener('submit', (e) => { e.preventDefault(); if (busy) busy.abort(); else ask(input.value); });

/* голос: распознавание речи браузера по-русски; поле светится, пока слушаем; договорили — вопрос уходит сам */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (!SR) $('#mic').hidden = true;
$('#mic').onclick = () => {
  if (rec) return rec.stop();
  if (busy) return;
  rec = new SR(); rec.lang = 'ru-RU'; rec.interimResults = true;
  let fin = '';
  rec.onstart = () => { $('#vf').classList.add('listening'); $('#mic').setAttribute('aria-pressed', 'true'); input.placeholder = 'Слушаю…'; };
  rec.onresult = (e) => { let t = ''; for (const r of e.results) { t += r[0].transcript; if (r.isFinal) fin = t; } input.value = t; autosize(); sync(); };
  rec.onerror = (e) => { if (e.error === 'not-allowed') toast('Разрешите микрофон в браузере'); };
  rec.onend = () => { $('#vf').classList.remove('listening'); $('#mic').setAttribute('aria-pressed', 'false'); input.placeholder = 'Голосом или текстом'; rec = null; if (fin.trim()) ask(fin); };
  rec.start();
};

sync();
loadData();
setInterval(() => { if (!st) loadData(); }, 60000);
if (Q.has('ask')) openAsk(Q.get('ask') || undefined);
if (Q.has('story')) setTimeout(() => { openStory(Number(Q.get('story')) || 0); if (Q.has('frame')) { st.f = Number(Q.get('frame')); showFrame(); pause(true); } }, 600);
if (Q.has('cases')) show('cases');
</script>
